<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2347"/>
      <stop offset="55%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#133260"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="54%" r="58%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DEBFA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.90"/>
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134079" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0A1E42" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- background plate (1:1, rounded) -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#plate)"/>
  <!-- inner subtle border -->
  <rect x="10" y="10" width="492" height="492" rx="100" fill="none" stroke="#3B82F6" stroke-opacity="0.18" stroke-width="2"/>
  <!-- ambient glow -->
  <ellipse cx="256" cy="270" rx="232" ry="222" fill="url(#glow)"/>

  <!-- network nodes -->
  <g fill="#38BDF8" opacity="0.5">
    <circle cx="92" cy="120" r="7"/>
    <circle cx="420" cy="120" r="7"/>
    <circle cx="78" cy="352" r="7"/>
    <circle cx="434" cy="352" r="7"/>
    <circle cx="120" cy="84" r="4.5"/>
    <circle cx="392" cy="84" r="4.5"/>
  </g>

  <!-- shield -->
  <path d="M256 120 L368 158 C369 214 370 244 368 276 C362 350 320 404 256 436 C192 404 150 350 144 276 C142 244 143 214 144 158 Z"
        fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="21" stroke-linejoin="round"/>

  <!-- checkmark -->
  <path d="M204 262 L243 304 L318 218" fill="none" stroke="#F2FAFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- live beacon anchored on shield peak -->
  <circle cx="256" cy="96" r="30" fill="url(#beaconGlow)"/>
  <circle cx="256" cy="96" r="12.5" fill="#34D399"/>
  <circle cx="256" cy="96" r="22" fill="none" stroke="#34D399" stroke-opacity="0.55" stroke-width="3"/>
</svg>
